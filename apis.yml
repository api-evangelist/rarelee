name: RareLee
description: RareLee (Rarelee) is a Seoul-based premium personal style consulting company founded in
  2017, offering data-driven hair, makeup, and fashion analysis. Its consultants classify a client's
  face shape, features, and skeletal structure across millions of type combinations to recommend
  personalized hairstyles, makeup designs, and coordinated outfits, both online and in person. Rarelee
  serves celebrity clientele and has collaborated with brands such as Shinsegae and Marriott. It is a
  direct-to-consumer service with no public API, developer portal, or technical integration surface; it
  was added to the API Evangelist network as a 500 Global portfolio lead for enrichment.
